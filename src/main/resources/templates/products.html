<!DOCTYPE html>

<html>

<head>
    <title>Products</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#3f51b5;
    color:white;
    padding:20px;
    text-align:center;
    position:relative;
}

.header button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    background:white;
    color:#3f51b5;
    cursor:pointer;
    font-weight:bold;
}

.cart-icon{
    position:absolute;
    right:20px;
    top:20px;
    cursor:pointer;
    font-size:18px;
    background:white;
    color:#3f51b5;
    padding:8px 12px;
    border-radius:20px;
    font-weight:bold;
}

.search-container{
    text-align:center;
    padding:20px;
    background:white;
}

.search-container input{
    padding:10px;
    margin:5px;
    width:180px;
    border:1px solid #ccc;
    border-radius:5px;
}

.search-container button{
    padding:10px 20px;
    margin-left:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#3f51b5;
    color:white;
}

.search-container button:hover{
    background:#283593;
}

.products-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
    justify-content:center;
}

.product-card{
    width:280px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    overflow:hidden;
    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-5px);
}

.product-image{
    width:100%;
    height:200px;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
}

.product-info{
    padding:15px;
}

.product-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.product-category{
    color:#666;
    margin-bottom:10px;
}

.product-price{
    font-size:22px;
    color:green;
    font-weight:bold;
}

.btn-cart{
    margin-top:10px;
    width:100%;
    padding:10px;
    border:none;
    background:#3f51b5;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

.btn-update{
    margin-top:10px;
    width:100%;
    padding:10px;
    border:none;
    background:orange;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

.btn-delete{
    margin-top:10px;
    width:100%;
    padding:10px;
    border:none;
    background:red;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

</style>

</head>

<body>

<div class="header">

    <h1>Products</h1>

    <div class="cart-icon" onclick="goToCart()">
        🛒 <span id="cartCount">0</span>
    </div>

    <button onclick="goToAddProductPage()">
        Add New Product
    </button>

</div>

<div class="search-container">

    <input type="text" id="categorySearch" placeholder="Search category">
    <button onclick="searchProducts()">Search Category</button>

    <br>

    <input type="text" id="nameSearch" placeholder="Search product name">
    <button onclick="searchByName()">Search Name</button>
    <button onclick="loadAllProducts()">Show All</button>

    <br><br>

    <input type="number" id="minPrice" placeholder="Min price">
    <input type="number" id="maxPrice" placeholder="Max price">
    <button onclick="filterByPrice()">Filter Price</button>

</div>

<div id="productsContainer" class="products-container"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

window.onload = function(){
    loadAllProducts();
    updateCartCount();
};

function updateCartCount(){
    document.getElementById("cartCount").innerText = cart.length;
}

function addToCart(productId){

    fetch('/products/' + productId)
        .then(res => res.json())
        .then(product => {

            cart.push(product);

            localStorage.setItem("cart", JSON.stringify(cart));

            updateCartCount();
        });
}

function goToCart(){
    window.location.href = "/cart";
}

function renderProducts(products){

    const container = document.getElementById("productsContainer");
    container.innerHTML = "";

    products.forEach(product => {

        container.innerHTML += `
            <div class="product-card">

                <div class="product-image">📦</div>

                <div class="product-info">

                    <div class="product-name">${product.name}</div>
                    <div class="product-category">${product.category}</div>
                    <div class="product-price">$${product.price}</div>

                    <div style="margin-top:10px;">
                        <b>Stock:</b> ${product.productDetails ? product.productDetails.stock : "N/A"}
                    </div>

                    <div>
                        <b>Details:</b> ${product.productDetails ? product.productDetails.details : "No details"}
                    </div>

                    <button class="btn-cart" onclick="addToCart(${product.id})">
                        Add to Cart
                    </button>

                    <button class="btn-update" onclick="goToEditPage(${product.id})">
                        Update
                    </button>

                    <button class="btn-delete" onclick="deleteProduct(${product.id})">
                        Delete
                    </button>

                </div>

            </div>
        `;
    });
}

function loadAllProducts(){
    fetch('/get-products')
        .then(r => r.json())
        .then(renderProducts);
}

function searchProducts(){
    const c = document.getElementById("categorySearch").value;
    fetch('/search-products?category=' + encodeURIComponent(c))
        .then(r => r.json())
        .then(renderProducts);
}

function searchByName(){
    const n = document.getElementById("nameSearch").value;
    fetch('/search-by-name?name=' + encodeURIComponent(n))
        .then(r => r.json())
        .then(renderProducts);
}

function filterByPrice(){
    let url = '/filter-products?';
    const min = document.getElementById("minPrice").value;
    const max = document.getElementById("maxPrice").value;

    if(min) url += "min=" + min + "&";
    if(max) url += "max=" + max;

    fetch(url).then(r => r.json()).then(renderProducts);
}

function goToEditPage(id){
    window.location.href = "/edit-product/" + id;
}

function goToAddProductPage(){
    window.location.href = "/add-new-product";
}

function deleteProduct(id){

    fetch('/products/' + id, { method:'DELETE' })
        .then(() => loadAllProducts());
}

</script>

</body>
</html>
