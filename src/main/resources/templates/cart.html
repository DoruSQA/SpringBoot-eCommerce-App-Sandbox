<!DOCTYPE html>
<html>

<head>
<title>Cart</title>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
}

.container{
    width:800px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

.item{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.total{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

button{
    padding:10px;
    margin:10px;
    border:none;
    cursor:pointer;
}

.cancel{
    background:red;
    color:white;
}

.complete{
    background:green;
    color:white;
}

</style>

</head>

<body>

<div class="container">

    <h2>My Cart</h2>

    <div id="cartItems"></div>

    <div class="total" id="total"></div>

    <button class="cancel" onclick="cancelCart()">Cancel</button>

    <button class="complete" onclick="completePurchase()">
        Complete Purchase
    </button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

window.onload = function(){
    renderCart();
};

function renderCart(){

    const container = document.getElementById("cartItems");
    container.innerHTML = "";

    let total = 0;

    cart.forEach(p => {

        total += p.price;

        container.innerHTML += `
            <div class="item">
                ${p.name} - $${p.price}
            </div>
        `;
    });

    document.getElementById("total").innerText =
        "Total: $" + total;
}

function cancelCart(){
    localStorage.removeItem("cart");
    window.location.href = "/products";
}

function completePurchase(){

    const ids = cart.map(p => p.id);

    fetch('/checkout', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(ids)
    })
    .then(r => r.text())
    .then(msg => {
        alert(msg);
        localStorage.removeItem("cart");
        window.location.href="/products";
    });
}

</script>

</body>
</html>
